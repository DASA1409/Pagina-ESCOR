services:
  db:
    image: postgres:16
    container_name: escor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ESCOR
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data: